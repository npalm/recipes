name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tools/cli/src/**'
      - 'tools/cli/package.json'
      - 'tsconfig.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tools/cli/src/**'
      - 'tools/cli/package.json'
      - 'tsconfig.json'
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required by CodeQL to read workflow/action metadata for analysis.
      contents: read # Required by actions/checkout and CodeQL to read repository source.
      security-events: write # Required by CodeQL to upload code scanning results.
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
