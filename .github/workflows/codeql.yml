name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tools/cli/src/**'
      - 'tools/cli/package.json'
      - 'tsconfig.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tools/cli/src/**'
      - 'tools/cli/package.json'
      - 'tsconfig.json'
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required by CodeQL to read workflow/action metadata for analysis.
      contents: read # Required by actions/checkout and CodeQL to read repository source.
      security-events: write # Required by CodeQL to upload code scanning results.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
