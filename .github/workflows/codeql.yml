name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tools/cli/src/**'
      - 'tools/cli/package.json'
      - 'tsconfig.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tests/**'
      - 'tools/cli/src/**'
      - 'tools/cli/package.json'
      - 'tsconfig.json'
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required by CodeQL to read workflow/action metadata for analysis.
      contents: read # Required by actions/checkout and CodeQL to read repository source.
      security-events: write # Required by CodeQL to upload code scanning results.
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
