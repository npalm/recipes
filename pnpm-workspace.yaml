packages:
  - 'tools/cli'

engineStrict: true
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  '@babel/core': '^7.29.1'
  baseline-browser-mapping: '^2.11.0'
  brace-expansion@^1.1.7: '^1.1.16'
  brace-expansion@^5.0.2: '^5.0.12'
  browserslist: '^4.28.7'
  esbuild: '^0.28.1'
  js-yaml@^3.13.1: '^3.15.0'
  nanoid@^3.3.11: '^3.3.16'
  postcss: '^8.5.23'
  sharp: '^0.35.0'
  source-map-js: '^1.2.2'
  undici: '^7.29.1'
  vite: '8.3.4'
